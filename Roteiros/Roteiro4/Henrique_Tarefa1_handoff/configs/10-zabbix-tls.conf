server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zabbix.maisplace.net.br;
    ssl_certificate /etc/letsencrypt/live/zabbix.maisplace.net.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zabbix.maisplace.net.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
